model:
  vocab_size: 32000
  d_model: 512
  n_layers: 8
  n_heads: 8          # Q heads
  n_kv_heads: 2       # KV heads (GQA 4:1 ratio)
  d_ff: 1365          # SwiGLU: 4/3 * d_model, rounded
  max_seq_len: 2048
  dropout: 0.0        # no dropout during pretraining
  rope_theta: 10000.0
  use_qk_norm: true   # 2025 novelty - QK-Norm from OLMo2/Qwen3

training:
  batch_size: 4                # micro batch (fits 4GB VRAM)
  grad_accumulation_steps: 64  # effective batch = 256
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 100000
  grad_clip: 1.0
  precision: bf16
  checkpoint_every: 1000
  log_every: 50
  fim_rate: 0.5               # 50% of batches use FIM objective

data:
  dataset_name: "bigcode/the-stack-v2-train-smol-ids"
  language: "python"
  streaming: true
  num_workers: 2
  sft_dataset: "ise-uiuc/Magicoder-OSS-Instruct-75K"

paths:
  tokenizer_path: "tokenizer/vocab"
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
